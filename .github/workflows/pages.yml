# Publishes the written report to GitHub Pages, so it can be read without cloning.
# Pages source: GitHub Actions (Settings -> Pages).
name: report

on:
  push:
    branches: [main]
    # Only redeploy when the published report changes. A commit that touches the
    # analysis code alone regenerates nothing that is served.
    paths:
      - reports/**
      - .github/workflows/pages.yml
      - site-assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site from the committed report
        run: |
          mkdir -p site
          cp reports/findings.html site/index.html
          cp -r reports site/reports

      - name: Add the link preview
        run: |
          cp site-assets/og.png site/og.png
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/index.html")
          html = page.read_text(encoding="utf-8")
          assert html.count("<head>") == 1, "expected one <head> tag"
          meta = Path("site-assets/og-meta.html").read_text(encoding="utf-8")
          page.write_text(html.replace("<head>", "<head>\n" + meta, 1), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
